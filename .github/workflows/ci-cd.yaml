name: CI/CD for DotnetBaseKit Tools

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: 1. Validate projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore projects
        run: |
          dotnet restore DotnetBaseKit.Cli/DotnetBaseKit.Cli.csproj
          dotnet restore DotnetBaseKit.Templates/DotnetBaseKit.Templates.csproj

      - name: Build CLI
        run: dotnet build DotnetBaseKit.Cli/DotnetBaseKit.Cli.csproj --no-restore --configuration Release

      - name: Build Templates
        run: dotnet build DotnetBaseKit.Templates/DotnetBaseKit.Templates.csproj --no-restore --configuration Release

  detect-changes:
    name: 2. Detect changed projects
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.projects.outputs.projects }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed projects
        id: projects
        run: |
          chmod +x ./scripts/*.sh

          JSON=$(./scripts/detect-changed-projects.sh \
            "${{ github.event.before }}" \
            "${{ github.sha }}")

          echo "Changed projects: $JSON"
          echo "projects=$JSON" >> "$GITHUB_OUTPUT"

  release:
    name: 3. Release project (${{ matrix.project }})
    needs: detect-changes

    if: needs.detect-changes.outputs.projects != '[]' && needs.detect-changes.outputs.projects != ''

    runs-on: ubuntu-latest

    environment: Production

    strategy:
      matrix:
        project: ${{ fromJSON(needs.detect-changes.outputs.projects) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Nuget Login
        uses: NuGet/login@v1
        id: nuget-login
        with:
         user: rafaelfraga

      - name: Process Version and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

        run: |
          chmod +x ./scripts/*.sh

          PROJECT="${{ matrix.project }}"
          PATH_FILTER="${PROJECT}/"

          echo "========================================"
          echo "Processing project: $PROJECT"
          echo "========================================"

          LATEST_TAG=$(./scripts/process-release.sh get-latest-tag "$PROJECT")
          echo "Latest tag: $LATEST_TAG"

          TYPE=$(./scripts/analyze-commits.sh \
            "$LATEST_TAG" \
            "$PATH_FILTER")

          echo "Change type: $TYPE"

          NEXT_VERSION=$(./scripts/process-release.sh \
            calculate-version \
            "$PROJECT" \
            "$LATEST_TAG" \
            "$TYPE")

          echo "Next version: $NEXT_VERSION"

          ./scripts/process-release.sh \
            publish \
            "$PROJECT" \
            "$NEXT_VERSION" \
            "$NUGET_API_KEY"

          ./scripts/process-release.sh \
            tag-and-release \
            "$PROJECT" \
            "$NEXT_VERSION" \
            "$LATEST_TAG"